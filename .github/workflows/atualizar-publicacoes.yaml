name: Atualizar publicações
on:
  schedule:
    - cron: "0 6 1 * *"   # todo dia 1, 03h (Brasília)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/orcid_sync.py
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      - name: Commit e publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain data/publicacoes/auto.yaml)" ]; then
            git config user.name "labintegra-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/publicacoes/auto.yaml
            git commit -m "Atualiza publicações (ORCID/OpenAlex)"
            git push
            gh workflow run deploy.yml
          else
            echo "Sem mudanças."
          fi