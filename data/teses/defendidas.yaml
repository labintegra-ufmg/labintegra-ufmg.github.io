  tipo: dissertacao
  titulo: Avaliação neutrônica de uma camada transmutadora em um sistema Tokamak
  ano: 2013
  uri: https://hdl.handle.net/1843/BUOS-978JZ3
  resumo: Using MCNP5 code were simulated different models representing the ITER system. It was evaluated the two alloys used by the first wall under high neutron flux. The neutron flux and the reaction rate along the different walls were obtained and evaluated. Based on the results, it was possible to conclude the best way to represent the fusion device evaluating; the different geometrical models, the best material to be used in the first wall taking into consideration the objective of transmutation and placed the transmutation layer.
