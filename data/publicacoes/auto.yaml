- titulo: Impactos socioambientais devidos à geração de energia elétrica de carvão mineral no Município de Figueira (Estado do Paraná, Sul do Brasil)
  autores:
  - Vinicius G. M. Silva
  - Fidéllis Bitencourt Gonzaga Louzada e Estanislau
