- titulo: 'Technology-Oriented Wind Farm Configuration Selection Using an RFR-Based Turbine Power-Output Surrogate Model: A National-Scale Assessment for Brazil'
  autores:
  - José Péricles Freire
  - Douglas Silva de Oliveira
  - Lihki Rubio
  - Jin Seok Yang
  - Carlos Eduardo Velasquez
  ano: 2026
  tipo: artigo
