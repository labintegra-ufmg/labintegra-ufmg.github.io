  resumo: A thermal model for the LS-VHTR (liquid-salt-cooled very high temperature reactor) concept has been developed by using the RELAP5 code. The LS-VHTR concept is proposed to operate at 2400 MWth, and it is cooled by liquid Li2BeF4 (Flibe) salt. An initial thermal analysis of the LS-VHTR concept was performed in a previous work where the simulation of only 1 unit cell was considered. In the present work, the RELAP5 model was increased to represent the complete core with all hexagonal blocks. Also, the salt recirculation has been simulated. The LS-VHTR core inlet and outlet coolant temperatures, heat structures temperature, and pressure drop have been simulated. The results were compared with the available data and demonstrate that the developed model is capable of reproducing the thermal behavior of the reactor in steady-state operation.
