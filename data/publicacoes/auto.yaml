- titulo: 'Stacked ML-GARCH for Bitcoin Risk Forecasting: A Novel Ensemble Approach for Superior Value-at-Risk Estimation'
  autores:
  - Lihki Rubio
  - Keyla Alba
  - Carlos E Velásquez
  - Filipe Ramos
  ano: 2026
  tipo: artigo
  veiculo: Mathematics
  acesso_aberto: true
  url_oa: https://www.mdpi.com/2227-7390/14/4/624/pdf?version=1770736895
  citacoes: 2
  resumo: Accurately forecasting Bitcoin’s conditional variance is essential for reliable Value-at-Risk (VaR) estimation yet remains challenging due to nonlinear dynamics, volatility clustering, and heavy-tailed return distributions. This study developed a novel stacking ensemble that integrates econometric and machine-learning models through XGBoost meta-learning to produce improved variance forecasts. Hybrid ML–GARCH specifications are incorporated separately to enrich the comparative analysis. All estimators are trained with time-aware cross-validation to ensure temporal coherence and prevent look-ahead bias. Using Bitcoin data from 2014 to 2020, the empirical results show that the stacking ensemble consistently outperforms both standalone and hybrid alternatives in conditional variance forecasting and VaR accuracy, including during periods of severe market stress such as the COVID-19 episode. Residual diagnostics confirm that the ensemble effectively captures persistent temporal dependencies in volatility dynamics. Overall, the proposed methodology offers an innovative and interpretable risk-management tool for financial institutions, combining statistical rigor with the adaptability of machine-learning techniques in digital asset markets.
