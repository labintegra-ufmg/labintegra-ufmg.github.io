  resumo: Long-lasting batteries like Radioisotope Thermoelectric Generator (RTG) nuclear batteries play a crucial role in spacecraft projects, offering lifespans of 14 to 48 years when lithium batteries are unsuitable. Designing RTG nuclear batteries involves considerations of thermal power generated from alpha decay heat energy density, radioisotope half-life, and production costs. This study explores non-proliferation radioisotopes as alternatives to Pu-238 to meet spacecraft exploration requirements, which include a 30-year lifespan, 2 kW of thermal power, and 100 W of electric power. The analysed radioisotopes include 232UO2, 238PuO2, 241AmO2, 233CmO2 and 234CmO2, with production cost assessed per gram. Results indicate that U-232 could enhance end-of-lifetime power supply and is even more cost-effective than the reference Pu-238. Cm-244 emerges as the most economically efficient option in terms of the mass needed to meet power requirements, followed by Cm-243 and U-232. Although Am-241 is pricier than Pu-238, it exhibits a smaller difference between initial and final power levels, making it suitable for longer-duration spacecraft missions.
