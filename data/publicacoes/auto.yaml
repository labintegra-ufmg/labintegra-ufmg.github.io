  resumo: The aim is to update the evaluated nuclear data library (ENDL) for nuclides used to simulate accelerator driven systems with JEFF3.1, JEFF3.2, and ENDF/B-VII.1. The applied methodology was, first of all, reproduced to 3 ENDL comparing the cross sections with the ADS Nuclear Data Library at 293.6 K. Second, libraries were processed at working temperature at 1200 K in containing fissile/fissionable material and 900 K for the remaining regions. Third, it is performed a criticality calculation at steady state using all temperatures processed at room temperature and working temperature and compared. Results, indicates the suitable ENDL to perform future burnup calculations.
