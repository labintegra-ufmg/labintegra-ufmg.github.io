- titulo: 'The curtailment cost paradox: Intermittency penalties invert hydrogen production economics in a vre-rich emerging economy'
  autores:
  - Douglas Silva de Oliveira
  - Carlos Eduardo Velasquez
  ano: 2026
  tipo: artigo
  veiculo: International Journal of Hydrogen Energy
  acesso_aberto: true
  url_oa: https://doi.org/10.1016/j.ijhydene.2026.156327
  citacoes: 0
  resumo: 'Electricity curtailment, the forced reduction of renewable output when grids cannot absorb available generation, is an increasingly structural feature of high-penetration renewable systems. In Northeast Brazil, where wind and solar capacity has surpassed 39 GW, curtailment already exceeds 10–20% of potential generation, eroding project returns. Green hydrogen appears to offer a natural solution: redirect curtailed electricity to electrolyzers. Yet this study demonstrates why this approach is more costly than dedicated renewable supply. Using integrated GIS-based spatial screening, Monte Carlo-Fuzzy-AHP weighting, and probabilistic techno-economic modeling across 36 planning regions and three technology horizons (2025, 2030, 2035), results show that dedicated renewable hubs achieve 15–30% lower levelized hydrogen costs than curtailment-capture systems. This counterintuitive result is driven by intermittency: ONS operational records show curtailment occurs in concentrated bursts, limiting electrolyzer utilization to 2000–3000 h/yr versus 4000 h/yr for dedicated hubs, amplifying capital cost per kilogram and erasing the electricity price advantage. Combined green hydrogen production potential ranges from 2.4 to 12.9 Mt H 2 /yr, with levelized costs declining from US$5.84–13.08/kg (2025) to US$1.58–2.74/kg (2035). Under 2035 conditions, 75% of projects achieve technical viability with mean NPV of US$120 M/hub.'
  id: doi-10-1016-j-ijhydene-2026-156327
