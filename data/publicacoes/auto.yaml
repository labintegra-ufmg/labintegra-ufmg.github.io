- titulo: ESTIMATIVA DA REDUÇÃO DE EMISSÕES DE CO₂ PELA INTRODUÇÃO DE HIDROGÊNIO VERDE NA FROTA DE TRANSPORTE PÚBLICO DE BELO HORIZONTE
