  citacoes: 0
  resumo: Entre as várias fontes de geração de energia elétrica no mundo, as termoelétricas a carvão são as que mais contribuem para a oferta de energia elétrica, entretanto emitem grandes quantidades de poluentes na atmosfera. O presente estudo busca quantificar os danos à saúde devido às emissões dos poluentes produzidas na Termoelétrica a carvão mineral no Município de Figueira, localizada no Estado do Paraná, que tem capacidade de geração elétrica de 20 MW. Este estudo é realizado em duas áreas, no município de Figueira (25 km2) e englobando outros municípios nas proximidades (2.500 km2). Para calcular os impactos socioambientais ocasionados pelo funcionamento da usina, utiliza-se o SIMPACTS, que estima e quantifica os custos de danos ambientais e à saúde pelas emissões dos gases SOx, NOx e de material particulado, além de mostrar sua dispersão em torno da usina. Os danos para o Município de Figueira custam em média US$ 56,60/GWh, atingindo no ano de maior poluição um total de US$ 127,60/GWh. Levando em consideração a região no entorno (2.500 km2), a média dos custos dos impactos pela poluição aumenta para US$ 4.475,50/GWh, com um pico de US$ 17.675,30/GWh, em 2017. Os resultados evidenciam uma disparidade dos impactos entre os anos de maior e menor emissão de poluentes, podendo indicar que um controle rigoroso das emissões pode causar uma redução significativa nos mesmos.
