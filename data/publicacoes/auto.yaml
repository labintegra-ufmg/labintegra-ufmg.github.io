  resumo: As mudanças climáticas e seus impactos representam desafios complexos para o século XXI, sendo amplamente atribuídas às emissões de gases de efeito estufa (GEE) provenientes de ativida des humanas. O Brasil, um dos maiores emissores de GEE no cenário global, estabeleceu um compromisso de redução de emissões de 53% até 2030. No entanto, o país continua a enfrentar obstáculos substanciais, evidenciados pelos persistentes altos níveis de emissões e pela implementação ineficaz de políticas climáticas robustas e abrangentes. Dentre as principais fontes emissoras, destacam-se as indústrias de mineração e siderurgia, que representam uma parcela significativa das emissões nacionais de GEE. Nesse contexto, a adoção de um mercado de carbono regulado, análogo ao Sistema de Comércio de Emissões da União Europeia (EU ETS), é considerada uma abordagem estratégica promissora para a mitigação desse desafio. A partir de uma análise comparativa baseada no ano de 2025, verificou-se que três empresas representativas desses setores industriais alcançaram reduções em suas emissões de 9,64%, 9,69%, e 12,11%, respectivamente, até 2030. A criação de um sistema de mercado de carbono que incorpore mecanismos de teto e comércio de emissões apresenta o potencial de induzir uma redução progressiva das emissões, além de promover práticas industriais mais sustentáveis e acelerar a transição para uma economia de baixo carbono.
