  citacoes: 0
  resumo: Abstract Decarbonization is increasingly constrained by finite cumulative carbon budgets and by the speed of structural and technological change. This study evaluates the conditional structural viability of Reference, 1.5°C, 2°C, NDC, and Energy Justice pathways across ten world regions. Region-specific baseline trajectories for population, GDP, primary energy consumption, and CO 2 emissions are generated through an out-of-sample evaluated multi-model forecasting framework. Mitigation pathways are then constructed through iterative scaling under historically calibrated annual transition bounds and assessed using rolling Cobb–Douglas diagnostics, emissions-intensity decomposition, and technology-specific mitigation matching. The results show that the 1.5°C-oriented pathway remains substantially above its adopted 276 GtCO 2 budget and retains unmet mitigation under all technology-deployment assumptions. The NDC pathway also remains technologically incomplete, whereas Energy Justice approaches high coverage under recent and medium-term deployment rates but retains residual implementation gaps. The modeled 2°C pathway shows near-complete coverage of the gross positive region-year mitigation requirement across the three deployment assumptions; however, cumulative emissions remain slightly above the adopted 978 GtCO 2 budget. Gross technology-matching requirements are therefore distinguished from the net global cumulative emissions difference.
