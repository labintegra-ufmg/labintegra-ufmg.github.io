  citacoes: 1
  resumo: This article addresses the urgent global need to shift away from fossil fuels towards cleaner energy sources, aligning with the transition to a low-carbon economy. It underscores hydrogen as a highly promising alternative due to its potential to significantly reduce greenhouse gases (GHG) emissions. With increasing investments and research aimed at improving its economic viability, various methods of hydrogen production are available, forming what is known as the "hydrogen rainbow". Green hydrogen, produced through water electrolysis powered by renewable energy sources (RES), emerges as a leading candidate for achieving a low-carbon economy. However, effective storage and transportation methods are crucial for determining the final cost and competitiveness of hydrogen. As countries strive for a lowcarbon future, continuous research and development efforts are underway to enhance hydrogen's competitiveness compared to fossil fuels. The geographical focus on Minas Gerais is motivated by its abundant solar energy resources, offering a prime opportunity for green hydrogen production. Through planning and strategic execution, the study aims to construct a comprehensive hydrogen supply chain in Minas Gerais, integrating infrastructure development for renewable energy installations and the hydrogen route. Leveraging simulations conducted using HOMER Pro software, which bring economic optimization and efficient integration of solar and wind systems for hydrogen production, the study seeks to optimize the economic viability of green hydrogen projects by quantifying the economic benefits and environmental impacts, thereby providing actionable insights for decision-making towards a sustainable energy transition. After evaluating the wind and solar potential of the state, it became evident that solar power holds greater potential compared to wind power. As a result, the projects outlined in the article prioritize the production of green hydrogen using solar energy. By showcasing multiple economically viable projects designed to replace fossil fuels across various societal sectors, the article highlights the significant potential of green hydrogen production in Minas Gerais. Leveraging the state's abundant solar resources and optimized project designs generated through software, these initiatives aim to address the growing demand for clean energy while mitigating environmental impact.
