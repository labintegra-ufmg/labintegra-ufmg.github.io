  resumo: A introdução do hidrogênio no sistema de transporte público oferece uma perspectiva promissora para a redução significativa das emissões de poluentes atmosféricos na cidade. Nesse sentido, conforme apresentado nesse trabalho, foi delineada a proposta de substituir gradativamente 10% da frota por ônibus móveis a hidrogênio da cidade de Belo Horizonte, em Minas Gerais, até 2040, em consonância com as metas globais de proteção ambiental e o Plano Local de Ação Climática (PLAC) desenvolvido pela Prefeitura de Belo Horizonte (PBH). Em um cenário projetado de 2026-2040, Belo Horizonte poderia evitar a emissão de 10.170 toneladas de CO₂, evidenciando os benefícios dessa transição, conforme mostram os resultados apresentados neste trabalho. Além de contribuir para a redução das emissões de CO₂, essa transformação impulsiona a tecnologia e consolida a infraestrutura urbana de Belo Horizonte, colocando a capital mineira como um modelo de sustentabilidade no setor de transporte público.
