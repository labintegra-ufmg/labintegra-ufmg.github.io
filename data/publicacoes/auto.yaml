  citacoes: 0
  resumo: In contemporary society, energy production stands as a crucial focal point, driven by humanity's heavy reliance on energy sources. However, the pressing concerns regarding environmental ramifications associated with energy generation, especially in the context of global warming and climate change, have taken center stage. Consequently, numerous nations are actively pursuing carbon-neutral energy solutions and investing in pioneering technologies. Among these solutions, nuclear energy emerges as a promising carbon-zero source, with innovations like Small Modular Reactors (SMRs) gaining prominence due to their potential to complement intermittent renewable energy sources. SMRs, exemplified by the SMART reactor developed by KAERI, offer streamlined systems and quicker construction compared to conventional nuclear plants. SMART serves multiple purposes including electricity generation, heating, desalination, and industrial process heat. Its advanced design has undergone thorough safety and performance testing, affirming its reliability. In conjunction with small modular reactors (SMRs), significant advancements have been made in the development of advanced fuels over recent decades. These fuels possess characteristics capable of addressing existing deficiencies and enabling the creation of more economically viable nuclear systems equipped with inherently designed safety features. These materials offer enhanced safety and improved economics for nuclear reactors, allowing for longer operational lifespans under higher levels of neutron irradiation. Moreover, they enable higher operating temperatures and exhibit greater resistance to aggressive corrosive environments, thereby enhancing overall reactor performance and durability. Even the predominant fuel utilized in light water reactor (LWR) systems is Uranium Dioxide (UO2), there is a notable increase in research investments directed towards exploring alternative fuels. Notably, Uranium Mononitride (UN) and Uranium Carbide (UC) offer advantages such as increased burnup capabilities and higher thermal conductivities, while Uranium Silicide (U3Si2) demonstrates superior resistance to Reactivity-Initiated Accidents (RIAs). This study delves into an evaluation of the neutronic behavior of SMART reactor under different fuel configurations, using UO2, UN, UC, and U3Si2 with similar enrichment levels. By analyzing various neutronic parameters, our aim is to offer comprehensive insights into the efficacy and safety of different fuels for energy generation in SMRs. This research endeavor seeks to elucidate the impact of fuel variations on neutron parameters, thereby providing valuable guidance for future reactor design and operational considerations in the context of SMRs.
